<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Acme Billing — Invoices</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="logo">◆ Acme Billing</div>
    <nav><a href="#" class="active">Invoices</a><a href="#">Customers</a><a href="#">Reports</a></nav>
    <span class="user" id="user"></span>
  </header>
  <main>
    <section id="list-view">
      <div class="row">
        <h1>Invoices</h1>
        <button class="primary" id="new-invoice">+ New invoice</button>
      </div>
      <div class="stats">
        <div class="stat"><span>Outstanding</span><b id="outstanding">RM 0.00</b></div>
        <div class="stat"><span>Invoices</span><b id="count">0</b></div>
      </div>
      <table class="card">
        <thead><tr><th>#</th><th>Customer</th><th>Due</th><th>Status</th><th class="num">Total</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <section id="form-view" hidden>
      <h1>New invoice</h1>
      <form class="card form" id="invoice-form">
        <label>Customer <input id="customer" placeholder="Customer name"></label>
        <label>Due date <input id="due" type="date"></label>
        <div class="lines">
          <div class="line head"><span>Item</span><span>Qty</span><span>Price (RM)</span></div>
          <div class="line"><input class="item" placeholder="Description"><input class="qty" type="number" value="1" min="1"><input class="price" type="number" step="0.01" placeholder="0.00"></div>
        </div>
        <div class="total">Total <b id="total">RM 0.00</b></div>
        <div class="actions">
          <button type="button" id="cancel">Cancel</button>
          <button class="primary" type="submit" id="save">Save invoice</button>
        </div>
      </form>
    </section>
  </main>
  <div class="toast" id="toast" hidden>Invoice saved</div>
  <script>
    const user = sessionStorage.getItem('user');
    if (!user) location.href = 'index.html';
    document.getElementById('user').textContent = user;
    const $ = id => document.getElementById(id);
    const rm = n => 'RM ' + n.toFixed(2);
    let invoices = JSON.parse(localStorage.getItem('invoices') || 'null') || [
      { no: 1001, customer: 'Kedai Runcit Ali', due: '2026-11-05', status: 'Paid', total: 320 },
      { no: 1002, customer: 'Bistro Mawar', due: '2026-11-12', status: 'Sent', total: 1250.5 },
    ];
    function render() {
      $('rows').innerHTML = invoices.map(i =>
        `<tr><td>${i.no}</td><td>${i.customer}</td><td>${i.due}</td><td><span class="pill ${i.status.toLowerCase()}">${i.status}</span></td><td class="num">${rm(i.total)}</td></tr>`).join('');
      $('count').textContent = invoices.length;
      $('outstanding').textContent = rm(invoices.filter(i => i.status !== 'Paid').reduce((s, i) => s + i.total, 0));
    }
    function total() {
      const qty = +document.querySelector('.qty').value || 0, price = +document.querySelector('.price').value || 0;
      return qty * price;
    }
    $('new-invoice').onclick = () => { $('list-view').hidden = true; $('form-view').hidden = false; };
    $('cancel').onclick = () => { $('form-view').hidden = true; $('list-view').hidden = false; };
    document.querySelector('.lines').addEventListener('input', () => $('total').textContent = rm(total()));
    $('invoice-form').addEventListener('submit', e => {
      e.preventDefault();
      invoices.push({ no: 1000 + invoices.length + 1, customer: $('customer').value || 'Unnamed', due: $('due').value || '—', status: 'Draft', total: total() });
      localStorage.setItem('invoices', JSON.stringify(invoices));
      e.target.reset(); $('total').textContent = rm(0);
      $('form-view').hidden = true; $('list-view').hidden = false; render();
      $('toast').hidden = false; setTimeout(() => $('toast').hidden = true, 2500);
    });
    render();
  </script>
</body>
</html>
